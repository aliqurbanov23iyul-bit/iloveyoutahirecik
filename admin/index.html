<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tahirə Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#080809;color:#eee;font:14px system-ui;padding:24px}main{max-width:1000px;margin:auto}h1{font-size:38px}input,textarea,button{background:#111;border:1px solid #333;color:#fff;border-radius:10px;padding:12px;font:inherit}input,textarea{width:100%}button{cursor:pointer}.login,.card{background:#0e0e10;border:1px solid #252326;border-radius:16px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:1fr auto;gap:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.event{background:#0b0b0c;border:1px solid #201e20;padding:12px;border-radius:12px}.event b{color:#f1536d}.event small{color:#777}.event pre{white-space:pre-wrap;word-break:break-word;color:#bbb}.hidden{display:none}.stat{font-size:24px;color:#f1536d}</style></head><body><main><h1>Tahirə / Admin</h1><div class="login"><div class="row"><input id="token" type="password" placeholder="ADMIN_TOKEN"><button id="load">Giriş</button></div></div><section id="panel" class="hidden"><div class="grid"><div class="card"><small>EVENTS</small><div class="stat" id="count">0</div></div><div class="card"><small>SESSIONS</small><div class="stat" id="sessions">0</div></div></div><div class="card"><h2>Sayt ayarları</h2><label>Instagram linki<input id="insta" placeholder="https://instagram.com/..."/></label><br><br><label>Musiqidən sonra mətn<textarea id="after" rows="3"></textarea></label><br><button id="saveCfg">Yadda saxla</button></div><div class="card"><h2>Cavablar və hərəkətlər</h2><div id="events" class="grid"></div></div></section></main><script>const $=s=>document.querySelector(s);let token='';async function req(url,opt={}){opt.headers={...(opt.headers||{}),authorization:'Bearer '+token};return fetch(url,opt)}async function load(){token=$('#token').value.trim();const r=await req('/api/admin');if(!r.ok)return alert('Token yanlışdır');const rows=await r.json();$('#panel').classList.remove('hidden');$('#count').textContent=rows.length;$('#sessions').textContent=new Set(rows.map(x=>x.session_id)).size;$('#events').innerHTML=rows.map(x=>`<div class="event"><b>${x.event_key}</b><br><small>${new Date(x.created_at).toLocaleString()}</small><pre>${JSON.stringify(x.event_value,null,2)}</pre></div>`).join('');const c=await fetch('/api/config').then(x=>x.json());$('#insta').value=c.instagram_url||'';$('#after').value=c.after_music||''}$('#load').onclick=load;$('#saveCfg').onclick=async()=>{const data={instagram_url:$('#insta').value.trim(),after_music:$('#after').value.trim()};const r=await req('/api/config',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});alert(r.ok?'Yadda saxlanıldı':'Xəta')};</script></body></html>
